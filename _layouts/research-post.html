<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — Leviathan OffSec</title>
  <meta name="description" content="{{ page.description | escape }}">
  <link rel="icon" type="image/png" href="{{ '/assets/logo.png?v=2' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #07090e; --panel: #0d111a; --border: #1b2333; --text: #e2e8f0; --muted: #94a3b8; --accent: #00ffcc; --mono: 'JetBrains Mono', monospace; --sans: 'Inter', sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.8 var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { width: min(820px, 100% - 3rem); margin: 0 auto; }
    header { position: sticky; top: 0; border-bottom: 1px solid var(--border); background: rgba(7, 9, 14, 0.94); }
    .nav { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; font: 0.8rem var(--mono); }
    .brand { color: var(--text); }
    .back { color: var(--muted); }
    main { padding: 3.5rem 0; }
    .meta { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; color: var(--accent); font: 700 0.72rem var(--mono); text-transform: uppercase; }
    .meta time { color: var(--muted); font-weight: 400; }
    h1 { margin: 1rem 0 2rem; font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.2; }
    .content h2 { margin: 3rem 0 1rem; font-size: 1.6rem; line-height: 1.35; }
    .content h3 { margin: 2rem 0 0.75rem; font-size: 1.2rem; }
    .content p, .content li { color: #cbd5e1; }
    .content ul, .content ol { padding-left: 1.5rem; }
    .content pre { overflow-x: auto; padding: 1.25rem; border: 1px solid var(--border); border-radius: 6px; background: #0b0f19; color: #93c5fd; font: 0.85rem/1.65 var(--mono); }
    .content code { padding: 0.12rem 0.3rem; border-radius: 3px; background: rgba(255,255,255,0.08); color: var(--accent); font: 0.9em var(--mono); }
    .content pre code { padding: 0; background: none; color: inherit; }
    .content blockquote { margin: 2rem 0; padding: 0.5rem 1.25rem; border-left: 3px solid var(--accent); background: var(--panel); color: var(--muted); }
    footer { padding: 2rem 0; border-top: 1px solid var(--border); color: var(--muted); font: 0.75rem var(--mono); }
    @media (max-width: 520px) { .container { width: min(100% - 2rem, 820px); } .nav { align-items: flex-start; flex-direction: column; justify-content: center; padding: 0.75rem 0; } }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <a class="brand" href="{{ '/' | relative_url }}">LEVIATHAN OFFSEC</a>
      <a class="back" href="{{ '/#deep-dive' | relative_url }}">← All research</a>
    </div>
  </header>
  <main class="container">
    <div class="meta">
      <span>{{ page.category }}</span>
      <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %Y" }}</time>
      {% if page.read_time %}<span>{{ page.read_time }}</span>{% endif %}
    </div>
    <h1>{{ page.title }}</h1>
    <article class="content">{{ content }}</article>
  </main>
  <footer><div class="container">LEVIATHAN OFFSEC · Research Lab</div></footer>
</body>
</html>
